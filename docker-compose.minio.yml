# Local S3-compatible store for the MF registry POC.
# Start: docker compose -f docker-compose.minio.yml up -d
# Console: http://localhost:9001 (minioadmin / minioadmin)
#
# Creates bucket mf-poc, public read + CORS for browser Module Federation.
# S3 API: http://localhost:9000 — path-style URLs:
#   http://localhost:9000/mf-poc/mf/<app>/latest/mf-manifest.json

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_mf_poc_data:/data

  minio-mc:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./deploy/minio-cors.json:/tmp/cors.json:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do sleep 1; done
        mc mb local/mf-poc --ignore-existing
        mc anonymous set download local/mf-poc
        mc cors set local/mf-poc /tmp/cors.json

volumes:
  minio_mf_poc_data:
